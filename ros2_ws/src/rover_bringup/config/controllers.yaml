controller_manager:
  ros__parameters:
    update_rate: 100  # Hz; every write() is also the firmware link heartbeat

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    # keep in sync with rover_description and firmware/app/src/control.c
    wheel_separation: 0.160
    wheel_radius: 0.033

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    # robot_localization owns the odom -> base_footprint transform
    enable_odom_tf: false
    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]

    open_loop: false
    cmd_vel_timeout: 0.5

    linear:
      x:
        max_velocity: 0.8
        max_acceleration: 1.5
    angular:
      z:
        max_velocity: 3.0
        max_acceleration: 6.0
