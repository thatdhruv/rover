name: firmware

on:
  push:
    branches: [main]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]

# The full Zephyr CI container is too large for a hosted runner, so install
# only what is needed.
jobs:
  unit-tests:
    name: ztest (native_sim)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: rover
      - uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: rover/firmware
          toolchains: ""
          sdk-version: 1.0.1
      - name: Host build deps
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Twister
        working-directory: rover
        run: |
          west twister -T firmware/tests -p native_sim --inline-logs -O twister-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twister-report
          path: rover/twister-out/twister.xml

  build:
    name: build (nucleo_f446re)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: rover
      - uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: rover/firmware
          toolchains: arm-zephyr-eabi
          sdk-version: 1.0.1
      - name: Build
        working-directory: rover
        run: west build -b nucleo_f446re firmware/app
      - uses: actions/upload-artifact@v4
        with:
          name: rover-nucleo_f446re
          path: rover/build/zephyr/zephyr.elf
