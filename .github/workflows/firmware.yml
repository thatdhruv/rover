name: firmware

on:
  push:
    branches: [main]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]

jobs:
  unit-tests:
    name: ztest (native_sim)
    runs-on: ubuntu-latest
    container: ghcr.io/zephyrproject-rtos/ci:latest
    env:
      ZEPHYR_SDK_INSTALL_DIR: /opt/toolchains
    steps:
      - uses: actions/checkout@v4
      - name: West init/update
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          west init -l firmware
          west update --narrow -o=--depth=1
          pip install -r zephyr/scripts/requirements-base.txt
      - name: Twister
        run: |
          zephyr/scripts/twister -T firmware/tests -p native_sim \
            --inline-logs -O twister-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twister-report
          path: twister-out/twister.xml

  build:
    name: build (nucleo_f446re)
    runs-on: ubuntu-latest
    container: ghcr.io/zephyrproject-rtos/ci:latest
    env:
      ZEPHYR_SDK_INSTALL_DIR: /opt/toolchains
    steps:
      - uses: actions/checkout@v4
      - name: West init/update
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          west init -l firmware
          west update --narrow -o=--depth=1
          pip install -r zephyr/scripts/requirements-base.txt
      - name: Build
        run: west build -b nucleo_f446re firmware/app
      - uses: actions/upload-artifact@v4
        with:
          name: rover-nucleo_f446re
          path: build/zephyr/zephyr.elf
