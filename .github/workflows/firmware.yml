name: firmware

on:
  push:
    branches: [main]
    paths: ["firmware/**", "tools/renode/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", "tools/renode/**", ".github/workflows/firmware.yml"]

# The full Zephyr CI container is too large for a hosted runner, so install
# only what is needed.
jobs:
  unit-tests:
    name: ztest (native_sim)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: firmware
          sdk-version: 1.0.1
      - name: Twister
        run: |
          west twister -T firmware/tests -p native_sim --inline-logs -O twister-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twister-report
          path: twister-out/twister.xml

  build:
    name: build (nucleo_f429zi, MCUboot, signed)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: firmware
          toolchains: arm-zephyr-eabi
          sdk-version: 1.0.1
      - name: Build bootloader + app (sysbuild)
        run: west build --sysbuild -b nucleo_f429zi firmware/app -d build/good
      - name: Build fault-injected app (hangs, never confirms)
        run: |
          west build --sysbuild -b nucleo_f429zi firmware/app -d build/bad -- \
            -DCONFIG_ROVER_TEST_BAD_IMAGE=y -DSB_CONFIG_BOOTLOADER_MCUBOOT=y
      - name: Verify the signature of the produced image
        run: |
          pip install imgtool
          imgtool verify -k bootloader/mcuboot/root-ec-p256.pem build/good/app/zephyr/zephyr.signed.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-nucleo_f429zi
          path: |
            build/good/merged.hex
            build/good/app/zephyr/zephyr.signed.bin
            build/bad/app/zephyr/zephyr.signed.bin
