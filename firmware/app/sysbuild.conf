# Build MCUboot alongside the app and sign the app image (ECDSA P-256).
# The default key is MCUboot's public development key: replace it for any real
# deployment (imgtool keygen) and keep the private key out of the repo.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
SB_CONFIG_MCUBOOT_MODE_SWAP_SCRATCH=y
