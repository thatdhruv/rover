# Overlay for micro-ROS builds: west build ... -- -DEXTRA_CONF_FILE=microros.conf -DROVER_MICROROS=ON
# libmicroros needs newlib and the POSIX API; the default build uses picolibc.
CONFIG_ROVER_MICROROS=y
CONFIG_MICROROS=y
CONFIG_PICOLIBC=n
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=n
CONFIG_POSIX_API=y
CONFIG_CPP=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y
CONFIG_MAIN_STACK_SIZE=4096
