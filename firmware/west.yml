manifest:
  # micro-ROS is opt-in: `west config manifest.group-filter -- +microros && west update`
  group-filter: [-microros]
  remotes:
    - name: micro-ros
      url-base: https://github.com/micro-ROS
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.4.0
      import:
        name-allowlist:
          - cmsis
          - cmsis_6
          - hal_stm32
          - mcuboot
          - picolibc
          - zephyr-lang-rust
          - zcbor
    - name: micro_ros_zephyr_module
      remote: micro-ros
      revision: rolling
      path: modules/lib/micro_ros_zephyr_module
      groups: [microros]
  self:
    path: firmware
